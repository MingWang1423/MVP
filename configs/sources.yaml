# ============================================================
# 采集源声明式配置（PROJECT_PLAN.md §5.4）
#   - 改配置不改代码：开关 / 调度间隔 / 限流 / 监听清单 / 源特有参数
#   - scripts/seed_sources.py 读取本文件写入数据库 source 表（未列出的源按注册表默认值登记）
#   - rate_limit 仅在「无 API Key」等兜底场景生效；NVD 实际档位由 RateLimiter.for_source 依据
#     NVD_API_KEY 是否存在自动选择 5/30 或 50/30
# ============================================================
version: 1

defaults:
  enabled: true
  interval_minutes: 60
  rate_limit: "10/1"
  timeout_s: 60

sources:
  # ---- 漏洞主数据（需 NVD_API_KEY；无 Key 时限流 5 req/30s）----
  nvd:
    enabled: true
    interval_minutes: 120
    rate_limit: "5/30"
    timeout_s: 60
    params:
      page_size: 2000      # NVD 单页上限
      window_days: 120     # 单次查询最大时间窗
      max_pages: 10        # 单窗口最大翻页数

  # ---- 生态包漏洞（无需鉴权，AI/ML 包监听）----
  osv:
    enabled: true
    interval_minutes: 60
    rate_limit: "10/1"
    timeout_s: 60
    params:
      ecosystem: PyPI
      watchlist: [vllm, ollama, transformers, langchain, torch]

  # ---- GitHub 安全公告（需 GITHUB_TOKEN）----
  ghsa:
    enabled: true
    interval_minutes: 120
    rate_limit: "10/1"
    timeout_s: 60
    params:
      page_size: 50
      max_pages: 5
      ecosystems: [PIP, NPM]
      keywords: [ai, ml, llm, langchain, torch, transformers, vllm, ollama, huggingface]

  # ---- CISA KEV 已知被利用漏洞（无需鉴权，更新频率低）----
  kev:
    enabled: true
    interval_minutes: 360
    rate_limit: "10/1"
    timeout_s: 60

  # ---- FIRST EPSS 利用概率（无需鉴权，每日快照）----
  epss:
    enabled: true
    interval_minutes: 360
    rate_limit: "10/1"
    timeout_s: 60
    params:
      page_limit: 100
      # model_date: "2024-04-15"   # 需要回溯历史快照时取消注释

  # ---- arXiv AI 安全论文（P4 新增；无需鉴权，12 小时一次）----
  #   - 增量按 submittedDate（连接器内部追加时间窗）
  #   - 只落 raw_item（元数据 + 摘要），不写 unified_vuln（论文实体 P6 处理）
  arxiv:
    enabled: true
    interval_minutes: 720
    rate_limit: "1/3"            # arXiv 官方建议：每 3 秒不超过 1 次
    timeout_s: 60
    params:
      query: 'cat:cs.CR AND (all:LLM OR all:agent OR all:"prompt injection")'
      max_results: 100

  # ---- 厂商仓库安全公告（P5 收尾新增；需 GITHUB_TOKEN）----
  #   - 复用 ghsa.py 的 GraphQL 查询与字段选择（repository.securityAdvisories）
  #   - 逐个仓库查询，适合「盯厂商」：ollama / vllm / langchain / transformers / pytorch
  vendor_github:
    enabled: true
    interval_minutes: 120
    rate_limit: "10/1"
    timeout_s: 60
    params:
      page_size: 20
      repos: [ollama/ollama, vllm-project/vllm, langchain-ai/langchain, huggingface/transformers, pytorch/pytorch]

  # ---- 厂商 / 安全博客 RSS/Atom（P5 收尾新增；无需鉴权）----
  #   - 通用 RSS 2.0 + Atom 1.0 解析（lxml）
  #   - 实测（2026-09-30）：cisa_alerts / pytorch 返回 403、apache_security RSS 404；
  #     github_security_blog / huggingface_blog / sans_isc 可达，故默认启用以保证可演示。
  #   - feeds 取值须在 connectors/rss_blog.py 的 RSS_BLOG_FEEDS 中注册
  rss_blog:
    enabled: true
    interval_minutes: 360
    rate_limit: "10/1"
    timeout_s: 45
    params:
      feeds: [github_security_blog, huggingface_blog, sans_isc, cisa_alerts]
      max_items_per_feed: 20
  #   - 增量按 from_publication_date（连接器内部追加 filter）
  openalex:
    enabled: true
    interval_minutes: 720
    rate_limit: "10/1"
    timeout_s: 60
    params:
      search: "AI security"
      max_results: 100
