# ============================================================
# React 前端 Nginx 配置（Day17 任务 3.2）
#   用法：docker compose up -d frontend-react  → http://localhost:3000
#   要点：
#     1. SPA 路由 fallback（try_files $uri /index.html）——React Router 深链刷新不 404；
#     2. /api 反向代理到 api:8000（容器名由 compose 网络 DNS 解析），
#        浏览器只访问同源 3000，无需 CORS，也不需要把容器名暴露给浏览器；
#     3. gzip 压缩 + 静态资源长缓存（Vite 产物带内容哈希，可 immutable）；
#     4. index.html 不缓存，保证发版后立即生效。
# ============================================================
server {
    listen       3000;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---- 压缩 ----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml font/woff2;

    # ---- 安全响应头（不影响功能）----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- 容器健康检查（compose healthcheck 用）----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- 后端 API 反向代理 ----
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 问答链路（LangGraph 多 Agent）耗时较长，读超时放宽到 3 分钟
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        proxy_buffering       off;
    }

    # ---- 带内容哈希的静态资源：长缓存 ----
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        access_log off;
        expires    30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files  $uri =404;
    }

    # ---- SPA 路由 fallback：/graph、/quality 等深链刷新交给前端路由 ----
    location / {
        add_header Cache-Control "no-store";
        try_files  $uri /index.html;
    }
}
