# ============================================================
# Alembic configuration (PROJECT_PLAN.md §5.2 P1)
# NOTE: this file is read with locale encoding by alembic,
#       so it must stay ASCII-only on zh-CN Windows (GBK locale).
#       DSN is NOT hardcoded here: alembic/env.py reads it from
#       aisec_intel.config.Settings (DATABASE_URL > degraded SQLite > PG_DSN).
# ============================================================

[alembic]
script_location = alembic
prepend_sys_path = src
version_path_separator = os
# migration file name template: <rev>_<slug>.py (use --rev-id 0001 to get 0001_init.py)
file_template = %%(rev)s_%%(slug)s
# NOTE: no `timezone = UTC` here: python.org builds on Windows ship no IANA tzdata,
#       which makes alembic fail with "Can't locate timezone: UTC" (cosmetic only).

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
