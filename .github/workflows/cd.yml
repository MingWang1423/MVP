name: CD

# 触发：推送 v* 标签（如 v1.0.0）或手动触发（Day18 任务 3，可选工作流）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write          # 推送到 GHCR 需要 packages:write

env:
  REGISTRY: ghcr.io
  IMAGE_BASENAME: ${{ github.repository }}   # owner/repo → ghcr.io/owner/repo

jobs:
  build-and-push:
    name: 构建并推送 Docker 镜像到 GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: Dockerfile
          - name: frontend
            context: .
            dockerfile: frontend/Dockerfile
          - name: frontend-react
            context: ./frontend-react
            dockerfile: ./frontend-react/Dockerfile
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASENAME }}-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: 构建并推送（带 gha 层缓存加速）
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          # 前端 react 镜像的运行阶段镜像：GHCR 上仍用官方 nginx（构建参数保留默认值）
          build-args: |
            RUNTIME_IMAGE=nginx:1.27-alpine
