# ============================================================
# 智能体驱动的 AI 安全知识情报系统 · 全栈编排（PROJECT_PLAN.md §5.1 / §5.10）
#   用法：docker compose up -d          → postgres + neo4j + chroma + api + frontend（5 服务）
#         docker compose ps            → 查看健康状态（全部 (healthy) 即就绪）
#         访问：API  http://localhost:8000/docs ｜ 前端 http://localhost:8501
# 说明：所有变量均有默认值，未创建 .env 也能 `docker compose config` 校验通过；
#       实际部署请先 `copy .env.example .env` 并填写口令。
# ============================================================

name: aisec-intel

services:
  postgres:
    image: postgres:16
    container_name: aisec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-aisec}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-aisec}
      POSTGRES_DB: ${PG_DB:-aisec}
      # 中文排序与 UTF8（CVE 描述含多语言文本）
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-aisec} -d ${PG_DB:-aisec}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [aisec-net]

  neo4j:
    image: neo4j:5
    container_name: aisec-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-aisec_dev_pwd}
      # R7 风险应对：限制堆内存，避免图规模增长拖垮演示机
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_PLUGINS: '[]'
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # neo4j 5 官方镜像自带 cypher-shell。
      # 注意：容器内没有 NEO4J_AUTH_PASSWORD 变量，口令需从 NEO4J_AUTH（user/password）中拆分。
      test:
        [
          "CMD-SHELL",
          "cypher-shell -a bolt://localhost:7687 -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1;' || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [aisec-net]

  chroma:
    image: chromadb/chroma:0.5.5
    container_name: aisec-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      # NOTE: 应用 API 占用 8000；chroma 服务端口改用 CHROMA_HOST_PORT（默认 8001）避免冲突。
      #       本项目默认走嵌入式 PersistentClient（CHROMA_PATH），该服务仅为架构完整性保留。
      - "${CHROMA_HOST_PORT:-8001}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat', timeout=5).status == 200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [aisec-net]

  # ---- FastAPI 服务（L5，DAY13 任务 3）----
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aisec-intel-api:local
    container_name: aisec-api
    restart: unless-stopped
    # .env 存在则加载（密钥等本地配置）；required: false 保证干净克隆也能起
    env_file:
      - path: .env
        required: false
    environment:
      # NOTE: .env 里的 PG_DSN/NEO4J_URI 指向 localhost（宿主机进程用），
      #       容器内必须覆盖为服务名；DATABASE_URL 清空以强制走 PG_DSN（见 Settings.effective_storage_dsn）
      DATABASE_URL: ""
      PG_DSN: postgresql+asyncpg://${PG_USER:-aisec}:${PG_PASSWORD:-aisec}@postgres:5432/${PG_DB:-aisec}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-aisec_dev_pwd}
      NEO4J_ENABLED: "${NEO4J_ENABLED:-true}"
      DEGRADED_MODE: "${DEGRADED_MODE:-false}"
      # 容器内不装 sentence-transformers（镜像体积）→ 用哈希嵌入（§3.3 降级路径）
      EMBEDDING_BACKEND: "${EMBEDDING_BACKEND:-hashing}"
      RAW_SNAPSHOT_DIR: /data/raw
      CHROMA_PATH: /data/chroma
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - api_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [aisec-net]

  # ---- Streamlit 前端（L6，DAY13 任务 3）----
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: aisec-intel-frontend:local
    container_name: aisec-frontend
    restart: unless-stopped
    environment:
      # 服务端（Streamlit 进程）通过容器网络调用 API
      API_BASE_URL: http://api:8000/api/v1
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4).status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [aisec-net]

volumes:
  pg_data:
  neo4j_data:
  neo4j_logs:
  chroma_data:
  api_data:

networks:
  aisec-net:
    driver: bridge
