# ============================================================
# 智能体驱动的 AI 安全知识情报系统 · 全栈编排（PROJECT_PLAN.md §5.1 / §5.10）
#   用法：docker compose up -d          → postgres + neo4j + chroma + api + scheduler + frontend-react
#         docker compose ps            → 查看健康状态（全部 (healthy) 即就绪）
#         访问：API  http://localhost:8000/docs
#               React 前端（唯一前端） http://localhost:3000
#               调度器（无端口）  docker compose logs -f scheduler
# 说明：所有变量均有默认值，未创建 .env 也能 `docker compose config` 校验通过；
#       实际部署请先 `copy .env.example .env` 并填写口令。
# ============================================================

name: aisec-intel

services:
  postgres:
    image: postgres:16
    container_name: aisec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-aisec}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-aisec}
      POSTGRES_DB: ${PG_DB:-aisec}
      # 中文排序与 UTF8（CVE 描述含多语言文本）
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-aisec} -d ${PG_DB:-aisec}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [aisec-net]

  neo4j:
    image: neo4j:5
    container_name: aisec-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-aisec_dev_pwd}
      # R7 风险应对：限制堆内存，避免图规模增长拖垮演示机
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_PLUGINS: '[]'
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # neo4j 5 官方镜像自带 cypher-shell。
      # 注意：容器内没有 NEO4J_AUTH_PASSWORD 变量，口令需从 NEO4J_AUTH（user/password）中拆分。
      test:
        [
          "CMD-SHELL",
          "cypher-shell -a bolt://localhost:7687 -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1;' || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [aisec-net]

  chroma:
    image: chromadb/chroma:0.5.5
    container_name: aisec-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      # NOTE: 应用 API 占用 8000；chroma 服务端口改用 CHROMA_HOST_PORT（默认 8001）避免冲突。
      #       本项目默认走嵌入式 PersistentClient（CHROMA_PATH），该服务仅为架构完整性保留。
      - "${CHROMA_HOST_PORT:-8001}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat', timeout=5).status == 200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [aisec-net]

  # ---- FastAPI 服务（L5，DAY13 任务 3）----
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aisec-intel-api:local
    container_name: aisec-api
    restart: unless-stopped
    # .env 存在则加载（密钥等本地配置）；required: false 保证干净克隆也能起
    env_file:
      - path: .env
        required: false
    environment:
      # NOTE: .env 里的 PG_DSN/NEO4J_URI 指向 localhost（宿主机进程用），
      #       容器内必须覆盖为服务名；DATABASE_URL 清空以强制走 PG_DSN（见 Settings.effective_storage_dsn）
      DATABASE_URL: ""
      PG_DSN: postgresql+asyncpg://${PG_USER:-aisec}:${PG_PASSWORD:-aisec}@postgres:5432/${PG_DB:-aisec}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-aisec_dev_pwd}
      NEO4J_ENABLED: "${NEO4J_ENABLED:-true}"
      DEGRADED_MODE: "${DEGRADED_MODE:-false}"
      # 容器内不装 sentence-transformers（镜像体积）→ 用哈希嵌入（§3.3 降级路径）
      EMBEDDING_BACKEND: "${EMBEDDING_BACKEND:-hashing}"
      RAW_SNAPSHOT_DIR: /data/raw
      CHROMA_PATH: /data/chroma
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - api_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [aisec-net]

  # ---- 调度器（P4/P9：分层 pipeline 采集/富化/图谱/向量 + 每日失败重试队列；Day23 任务 1）----
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    # 与 api 共用同一镜像（同一 Dockerfile，构建层完全复用），仅启动命令不同：
    #   避免为调度器重复构建/重复导出离线镜像包（离线包仍只需 5 个镜像）。
    image: aisec-intel-api:local
    container_name: aisec-scheduler
    restart: unless-stopped
    # 常驻调度器：pipeline 四层 interval job + maintenance:retry-failed（cron 0 2 * * *）
    command: python -m scripts.run_scheduler
    env_file:
      - path: .env
        required: false
    environment:
      # NOTE: 与 api 服务同口径——容器内必须用服务名，.env 里指向 localhost 的地址会被覆盖
      DATABASE_URL: ""
      PG_DSN: postgresql+asyncpg://${PG_USER:-aisec}:${PG_PASSWORD:-aisec}@postgres:5432/${PG_DB:-aisec}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-aisec_dev_pwd}
      NEO4J_ENABLED: "${NEO4J_ENABLED:-true}"
      DEGRADED_MODE: "${DEGRADED_MODE:-false}"
      # 容器内不装 sentence-transformers（镜像体积）→ 用哈希嵌入（§3.3 降级路径）
      EMBEDDING_BACKEND: "${EMBEDDING_BACKEND:-hashing}"
      RAW_SNAPSHOT_DIR: /data/raw
      CHROMA_PATH: /data/chroma
    volumes:
      # 与 api 共享数据卷：采集快照 / 向量索引 / 降级 SQLite 对两边可见
      - api_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      chroma:
        condition: service_healthy
    # 无端口暴露：调度器只对外部数据源与三库出站连接（运维入口为 docker compose logs / exec）
    healthcheck:
      # NOTE: 本服务复用 api 镜像，镜像内自带探针是 api 的 :8000/healthz —— 调度器没有 HTTP 端口，
      #   若不覆盖会一直 (unhealthy)。这里换成「调度进程存活」探针：扫描 /proc/*/cmdline 是否含
      #   run_scheduler（python:3.11-slim 无 pgrep，故此写法零依赖、不装额外包）。
      test:
        [
          "CMD-SHELL",
          "python -c \"import pathlib,sys; ok=any('run_scheduler' in f.read_bytes().decode('utf-8','ignore') for f in pathlib.Path('/proc').glob('[0-9]*/cmdline')); sys.exit(0 if ok else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [aisec-net]

  # ---- React 前端（L6，唯一前端；DAY17 任务 3：多阶段构建 + Nginx 托管）----
  frontend-react:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      args:
        # NOTE: 这里是**构建期**变量（Vite 只在 build 时注入 import.meta.env）。
        #       默认留空 → 前端请求相对路径 /api/v1/...，由 nginx.conf 同源反代到 api:8000。
        #       不要填 http://api:8000：`api` 只是 compose 网络内的 DNS 名称，
        #       宿主机浏览器解析不了它（会 ERR_NAME_NOT_RESOLVED）。
        #       确需浏览器直连后端时填 http://localhost:8000 并确保 API 已开 CORS。
        VITE_API_URL: ${VITE_API_URL:-}
        # 运行阶段基础镜像，默认官方 nginx:1.27-alpine。
        # 本机 Docker Hub 镜像源（daocloud）当前 TLS 证书异常、拉不到官方 node/nginx 镜像时，
        # 可临时指向本机已构建的 nginx 基础镜像：
        #   $env:REACT_RUNTIME_IMAGE='nginx-local:bookworm'; docker compose build frontend-react
        RUNTIME_IMAGE: ${REACT_RUNTIME_IMAGE:-nginx:1.27-alpine}
    image: aisec-intel-frontend-react:local
    container_name: aisec-frontend-react
    restart: unless-stopped
    ports:
      - "${REACT_FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # nginx:alpine 自带 busybox wget；探测 nginx.conf 里的 /healthz
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [aisec-net]

volumes:
  pg_data:
  neo4j_data:
  neo4j_logs:
  chroma_data:
  api_data:

networks:
  aisec-net:
    driver: bridge
