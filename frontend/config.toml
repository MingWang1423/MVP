# Streamlit 前端配置（Day12 任务 4 交付物）。
#
# NOTE:
#   Streamlit 实际读取的路径是 `frontend/.streamlit/config.toml`
#   （由 streamlit run 的工作目录决定），本文件内容与之保持一致，
#   便于评审与 Docker 镜像直接拷贝查看。
[theme]
base = "light"
primaryColor = "#b71c1c"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f5"
textColor = "#212121"
font = "sans serif"

[server]
port = 8501
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"
